# Where the radar looks. Each company lists one or more sources:
#
#   greenhouse | lever | ashby | workable | recruitee | personio | smartrecruiters
#        {ats: <type>, slug: <board name>}     slug can be a list of guesses: the first that exists wins
#   workday   {ats: workday, host: <tenant>.wdN.myworkdayjobs.com, site: <SiteName>}   (site optional)
#   html      server-rendered career page: {ats: html, urls: [...], link_pattern: <regex>}
#   browser   JavaScript career page (needs Playwright), same fields as html
#   amazon    amazon.jobs search            adzuna   aggregator (needs a free API key)
#   auto      ATS unknown: the radar probes the common free APIs and remembers what it finds
#
# "verified" = a live job URL on that board was seen in November 2026. Everything else is a
# best guess: after the first run, the website footer ("Sources") and `python -m internradar check`
# show which ones work. Find a company's board with `python -m internradar discover "Name"`.
# Quant / trading firms are intentionally not listed.

companies:

  # ---------------------------------------------------------------- AI labs & big tech
  - name: Anthropic
    sector: AI lab
    sources: [{ats: greenhouse, slug: anthropic}]                 # verified (Zürich roles)
  - name: Google DeepMind
    sector: AI lab
    sources: [{ats: greenhouse, slug: deepmind}]                  # verified (moving to Google Careers)
  - name: OpenAI
    sector: AI lab
    sources: [{ats: ashby, slug: openai}]                         # verified (Zürich office)
  - name: Mistral AI
    sector: AI lab
    sources: [{ats: lever, slug: mistral}]                        # verified (Zürich roles)
  - name: Isomorphic Labs
    sector: AI lab
    sources: [{ats: greenhouse, slug: isomorphiclabs}]            # verified (Lausanne office)
  - name: RAI Institute
    sector: Robotics
    sources: [{ats: lever, slug: rai}]                            # verified (Zürich internships)
  - name: Hugging Face
    sector: AI lab
    sources: [{ats: workable, slug: huggingface}]                 # mostly remote roles
  - name: Sony AI
    sector: AI lab
    sources:
      - ats: html
        urls: ["https://ai.sony/joinus/"]
        link_pattern: "/joinus/job-roles/[A-Za-z0-9_%-]+/?$"
        fetch_details: true                                       # reads "Location flexible (Tokyo, Zurich)"
  - name: NVIDIA
    sector: Big tech
    sources: [{ats: workday, host: nvidia.wd5.myworkdayjobs.com, site: NVIDIAExternalCareerSite}]  # verified
  - name: Pinterest
    sector: Big tech
    sources: [{ats: greenhouse, slug: [pinterest, pinterestjobadvertisements]}]  # Greenhouse verified; ML interns in Zürich
  - name: Amazon
    sector: Big tech
    sources: [{ats: amazon}]
  - name: Google
    sector: Big tech
    sources:
      - ats: browser
        urls: ["https://www.google.com/about/careers/applications/jobs/results?q=intern&location=Switzerland"]
        link_pattern: "/careers/applications/jobs/results/\\d+"
        assume_country: ch
        fetch_details: true
  - name: Apple
    sector: Big tech
    sources:
      - ats: browser
        urls: ["https://jobs.apple.com/en-us/search?search=intern&location=switzerland-CHE"]
        link_pattern: "jobs\\.apple\\.com/[a-z-]+/details/\\d+"
        assume_country: ch
        fetch_details: true
  - name: Meta
    sector: Big tech
    sources:
      - ats: browser
        urls: ["https://www.metacareers.com/jobs?q=intern&offices[0]=Zurich%2C%20Switzerland"]
        link_pattern: "metacareers\\.com/(?:v2/)?jobs/\\d+"
        assume_country: ch
        fetch_details: false
  - name: Microsoft
    sector: Big tech
    sources:
      - ats: browser
        urls: ["https://jobs.careers.microsoft.com/global/en/search?q=intern&lc=Switzerland"]
        link_pattern: "(?:/global/en/job/\\d+|/careers/job/\\d+)"
        assume_country: ch
        fetch_details: false
  - name: IBM Research
    sector: Big tech
    sources:
      - ats: browser
        urls: ["https://www.ibm.com/careers/search?q=intern&field_keyword_05[0]=Switzerland"]
        link_pattern: "(?:jobId=\\d+|/job/\\d+)"
        assume_country: ch
        fetch_details: false
  - name: Disney Research
    sector: Research
    sources: [{ats: workday, host: disney.wd5.myworkdayjobs.com, site: disneycareer}]   # guess; Zürich lab interns

